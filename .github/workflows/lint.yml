name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Syntax & style (PHP 8.2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Style/syntax checks run on a single PHP version by design -- the
      # PHP 7.4/8.2 compatibility matrix is already covered by tests.yml.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none
          tools: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP syntax (php -l)
        run: |
          set -e
          git ls-files -- '*.php' | while read -r file; do
            php -l "$file"
          done

      # Ruleset lives in phpcs.xml (PSR-12, with a documented, narrow
      # exclusion for PHPUnit's snake_case test method convention).
      # -n suppresses warnings (e.g. the 120-char soft line-length limit)
      # from failing the build; only real PSR-12 errors fail this job.
      - name: PHP_CodeSniffer (PSR-12)
        run: vendor/bin/phpcs -n
