# ⚠️  LOCAL DEVELOPMENT / TESTING ONLY — DO NOT USE FOR STAGING OR PRODUCTION ⚠️
#
# This compose file exists solely to run FreeScout + this module on a
# developer's own machine for manual testing. It intentionally uses:
#   - Hardcoded, weak database credentials (freescout/freescout).
#   - A world-writable `chmod -R 777` on container startup (see the `app`
#     service's `command` below) to work around host/container UID mismatches.
#   - Ports bound to 127.0.0.1 only, but with no TLS and no auth hardening
#     beyond that.
# None of this is acceptable outside a throwaway local environment. Do not
# copy this file as a starting point for a staging or production deployment —
# build a proper compose/orchestration config with secrets management, TLS,
# least-privilege file permissions, and non-default credentials instead.

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: freescout_root
      MYSQL_DATABASE: freescout
      MYSQL_USER: freescout
      MYSQL_PASSWORD: freescout
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:33061:3306"

  app:
    build:
      context: ./php
    volumes:
      - ./freescout:/var/www/html
      - ../:/var/www/html/Modules/ModuleManager
      # This module's own repo (mounted above) contains docker/freescout — the
      # very same host directory already mounted at /var/www/html. Without this
      # line, that's a literal bind-mount cycle: Modules/ModuleManager/docker/
      # freescout resolves back to /var/www/html, and any recursive operation
      # over Modules/ (like the chmod below) hits GNU chmod's circular-directory
      # guard and exits 1. An empty named volume shadows just that one subpath
      # inside the container, breaking the cycle without affecting anything the
      # module's own PHP code reads or writes at runtime.
      - module_repo_docker_dir_excluded:/var/www/html/Modules/ModuleManager/docker
    working_dir: /var/www/html
    # The bind-mounted freescout/ and this repo are host-owned, not owned by the
    # container's php-fpm user — without this, every real HTTP request 500s
    # (found during Task 8's verification). Not appropriate for production; fine
    # for a disposable local dev/test instance.
    command: ["sh", "-c", "chmod -R 777 storage bootstrap/cache Modules && php-fpm"]
    depends_on:
      - db

  web:
    image: nginx:1.25-alpine
    volumes:
      - ./freescout:/var/www/html
      - ../:/var/www/html/Modules/ModuleManager
      # Same bind-mount-cycle guard as the app service above (see its comment) --
      # nginx serves this module's Public/ assets directly (bypassing PHP-FPM),
      # so it needs the identical live mount of this repo, and the identical
      # exclusion to avoid looping into Modules/ModuleManager/docker/freescout.
      - module_repo_docker_dir_excluded:/var/www/html/Modules/ModuleManager/docker
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - app

volumes:
  db_data:
  module_repo_docker_dir_excluded:
