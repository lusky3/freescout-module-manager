services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: freescout_root
      MYSQL_DATABASE: freescout
      MYSQL_USER: freescout
      MYSQL_PASSWORD: freescout
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "33061:3306"

  app:
    build:
      context: ./php
    volumes:
      - ./freescout:/var/www/html
      - ../:/var/www/html/Modules/ModuleManager
    working_dir: /var/www/html
    depends_on:
      - db

  web:
    image: nginx:1.25-alpine
    volumes:
      - ./freescout:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app

volumes:
  db_data:
