services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: freescout_root
      MYSQL_DATABASE: freescout
      MYSQL_USER: freescout
      MYSQL_PASSWORD: freescout
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "33061:3306"

  app:
    build:
      context: ./php
    volumes:
      - ./freescout:/var/www/html
      - ../:/var/www/html/Modules/ModuleManager
    working_dir: /var/www/html
    # The bind-mounted freescout/ and this repo are host-owned, not owned by the
    # container's php-fpm user — without this, every real HTTP request 500s
    # (found during Task 8's verification). Not appropriate for production; fine
    # for a disposable local dev/test instance.
    command: ["sh", "-c", "chmod -R 777 storage bootstrap/cache Modules && php-fpm"]
    depends_on:
      - db

  web:
    image: nginx:1.25-alpine
    volumes:
      - ./freescout:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app

volumes:
  db_data:
